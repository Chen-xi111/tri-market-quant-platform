name: tests

on:
  push:
  pull_request:

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Check portfolio code
        run: python -m ruff check streamlit_app.py platform_hub.py app_pages portfolio scripts
      - name: Validate public release boundary
        run: python scripts/release_check.py
      - name: Run public portfolio tests
        run: PYTHONPATH=. python -m pytest -q portfolio/tests

  market-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        market: [cn, hk, us]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run ${{ matrix.market }} tests
        working-directory: systems/${{ matrix.market }}
        run: python -m pytest -q
