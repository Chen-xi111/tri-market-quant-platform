name: tests

on:
  push:
  pull_request:

jobs:
  portfolio-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest "ruff==0.17.5"
      - name: Check portfolio code
        run: python -m ruff check streamlit_app.py platform_hub.py app_pages portfolio scripts
      - name: Check market decision code
        run: >-
          python -m ruff check
          systems/cn_lab
          systems/cn/market_clock.py
          systems/cn/trade_plan.py
          systems/cn/trade_decision.py
          systems/cn/fund_flow/opportunity_scanner.py
          systems/hk/market_clock.py
          systems/hk/trade_plan.py
          systems/hk/trade_decision.py
          systems/hk/trade_decision_shared.py
          systems/hk/market_scan/opportunity_scanner.py
          systems/us/quote_freshness.py
          systems/us/stock_ranking.py
          systems/us/trade_plan.py
          systems/us/trade_decision.py
          systems/us/trade_decision_shared.py
      - name: Validate public release boundary
        run: python scripts/release_check.py
      - name: Run public portfolio tests
        run: PYTHONPATH=. python -m pytest -q portfolio/tests

  market-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - market: cn
            pythonpath: .
          - market: cn_lab
            pythonpath: ../cn
          - market: hk
            pythonpath: .
          - market: us
            pythonpath: .

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run ${{ matrix.market }} tests
        working-directory: systems/${{ matrix.market }}
        run: PYTHONPATH=${{ matrix.pythonpath }} python -m pytest -q
